<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REHOBOTH ASSEMBLY HQ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#001f4d,#0047ab,#008cff);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

.container{
width:90%;
max-width:400px;
}

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 0 40px rgba(0,140,255,.6);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
box-shadow:0 0 20px #008cff;
}
to{
box-shadow:0 0 40px #00d9ff;
}
}

#welcome{
font-size:22px;
font-weight:bold;
line-height:1.8;
min-height:120px;
}

.hidden{
display:none;
}

.slideDown{
animation:slideDown 1s forwards;
}

@keyframes slideDown{
to{
transform:translateY(700px);
opacity:0;
}
}

.menu{
animation:fadeIn 1s;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.btn{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#00aaff;
color:white;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

.form{
margin-top:20px;
animation:fadeIn .6s;
}

.input{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:12px;
outline:none;
background:rgba(255,255,255,.15);
color:white;
font-size:15px;
}

.input::placeholder{
color:#ddd;
}

.back{
background:#444;
}

.logo{
font-size:26px;
font-weight:bold;
margin-bottom:10px;
color:#00d9ff;
}

.small{
font-size:13px;
opacity:.8;
margin-top:8px;
}

</style>
</head>
<body>

<div class="container">

<div class="card" id="welcomeCard">
<div id="welcome"></div>
</div>

<div class="card menu hidden" id="menuCard">

<div class="logo">REHOBOTH ASSEMBLY HQ</div>
<div class="small">Choose an option to continue</div>

<button class="btn" onclick="showCreate()">
CREATE ACCOUNT
</button>

<button class="btn" onclick="showLogin()">
LOGIN
</button>

<button class="btn" onclick="showGuest()">
GUEST MODE
</button>

</div>

<div class="card hidden" id="createCard">

<h2>Create Account</h2>

<input class="input" id="createName" placeholder="Name">

<input class="input" id="createEmail" placeholder="Email / Phone">

<input class="input" type="password" id="createPass" placeholder="Password">

<button class="btn" onclick="createAccount()">
Continue
</button>

<button class="btn back" onclick="goBack()">
Back
</button>

</div>

<div class="card hidden" id="loginCard">

<h2>Login</h2>

<input class="input" id="loginEmail" placeholder="Email / Phone">

<input class="input" type="password" id="loginPass" placeholder="Password">

<button class="btn" onclick="login()">
Continue
</button>

<button class="btn back" onclick="goBack()">
Back
</button>

</div>

<div class="card hidden" id="guestCard">

<h2>Guest Mode</h2>

<input class="input" id="guestName" placeholder="Your Name">

<button class="btn" onclick="guestLogin()">
Continue
</button>

<button class="btn back" onclick="goBack()">
Back
</button>

</div>

</div>

<script>

// Already logged in?

if(localStorage.getItem("rehobothUser")){
window.location.href="dashboard.html";
}

// Typing animation

const text =
"𝚆𝙴𝙻𝙲𝙾𝙼𝙴 𝚃𝙾\n\n𝚁𝙴𝙷𝙾𝙱𝙾𝚃𝙷\n\n𝙰𝚂𝚂𝙴𝙼𝙱𝙻𝚈 𝙷𝚀";

let i=0;

function typeText(){

if(i<text.length){

document.getElementById("welcome").innerHTML +=
text.charAt(i)=="\n" ? "<br>" : text.charAt(i);

i++;

setTimeout(typeText,100);

}else{

setTimeout(()=>{
document.getElementById("welcomeCard")
.classList.add("slideDown");

setTimeout(()=>{
document.getElementById("welcomeCard")
.classList.add("hidden");

document.getElementById("menuCard")
.classList.remove("hidden");
},1000);

},5000);

}

}

typeText();

// Forms

function showCreate(){
hideAll();
createCard.classList.remove("hidden");
}

function showLogin(){
hideAll();
loginCard.classList.remove("hidden");
}

function showGuest(){
hideAll();
guestCard.classList.remove("hidden");
}

function goBack(){
hideAll();
menuCard.classList.remove("hidden");
}

function hideAll(){

menuCard.classList.add("hidden");
createCard.classList.add("hidden");
loginCard.classList.add("hidden");
guestCard.classList.add("hidden");

}

// Create Account

function createAccount(){

let name=document.getElementById("createName").value;
let email=document.getElementById("createEmail").value;
let pass=document.getElementById("createPass").value;

if(!name || !email || !pass){
alert("Fill all fields");
return;
}

let user={
name:name,
email:email,
password:pass,
guest:false
};

localStorage.setItem(
"rehobothUser",
JSON.stringify(user)
);

window.location.href="dashboard.html";

}

// Login

function login(){

let email=document.getElementById("loginEmail").value;
let pass=document.getElementById("loginPass").value;

let user=JSON.parse(
localStorage.getItem("rehobothUser")
);

if(!user){
alert("No account found");
return;
}

if(user.email===email && user.password===pass){

window.location.href="dashboard.html";

}else{

alert("Wrong login details");

}

}

// Guest

function guestLogin(){

let name=document.getElementById("guestName").value;

if(!name){
alert("Enter your name");
return;
}

let user={
name:name,
guest:true
};

localStorage.setItem(
"rehobothUser",
JSON.stringify(user)
);

window.location.href="dashboard.html";

}

</script>

</body>
</html>
